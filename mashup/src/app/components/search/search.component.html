<!-- Barre de recherche partagée — utilisée depuis NavigationComponent -->
<div class="search-bar">

  <label for="itno-input" class="label">Code article (ITNO)</label>

  <div class="search-row">
    <input
      soho-input
      id="itno-input"
      type="text"
      placeholder="Ex : 23454"
      [(ngModel)]="itno"
      (keyup.enter)="lancer()" />

    <button soho-button="primary" (click)="lancer()">
      Rechercher
    </button>
  </div>

</div>
