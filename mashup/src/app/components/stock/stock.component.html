<div class="stock-container">

  <!-- Indicateur de chargement Soho -->
  <div *ngIf="loading" class="loading-bar">
    <div soho-busyindicator [active]="true" displayDelay="0"></div>
  </div>

  <!-- Erreur -->
  <div *ngIf="erreur" class="error-banner">
    <svg soho-icon icon="error" class="error-icon"></svg>
    {{ erreur }}
  </div>

  <!-- État d'accueil -->
  <div *ngIf="!article && !loading && !erreur" class="welcome-state">
    <svg soho-icon icon="search" class="welcome-icon"></svg>
    <p>Saisissez un code article pour afficher les stocks.</p>
  </div>

  <!-- Résultats -->
  <ng-container *ngIf="article">
    <div class="article-header">
      <div class="article-code">
        <span class="article-code__label">Code P.F.</span>
        <strong class="article-code__value">{{ article.itno }}</strong>
      </div>
      <div class="article-libelle">{{ article.itds }}</div>
      <span class="article-unit">{{ article.unms }}</span>
      <div class="article-poids">
        Poids net : <strong>{{ article.poidsNet }} kg</strong> <!-- Source CUSEXTMI -->
      </div>
    </div>

    <!-- Onglets -->
    <div class="tabs-wrapper">
      <nav class="tab-nav">
        <button
          *ngFor="let tab of tabs"
          class="tab-btn"
          [class.tab-btn--active]="activeTab === tab.id"
          (click)="setTab(tab.id)">
          {{ tab.label }}
          <span *ngIf="tab.badge" class="tab-count">{{ badgeFor(tab.id) }}</span>
        </button>
      </nav>

      <!-- Contenu des onglets -->
      <div class="tab-panel">
        <app-tab-synthese     *ngIf="activeTab === 'synthese'"     [article]="article"></app-tab-synthese>
        <app-tab-ofpof        *ngIf="activeTab === 'ofpof'"        [lignes]="ofpofLignes"></app-tab-ofpof>
        <app-tab-achats       *ngIf="activeTab === 'achats'"       [lignes]="achatsLignes"></app-tab-achats>
        <app-tab-reservations *ngIf="activeTab === 'reservations'" [lignes]="reservationsLignes"></app-tab-reservations>
        <app-tab-actions      *ngIf="activeTab === 'actions'"      [lignes]="actionsLignes"></app-tab-actions>
      </div>
    </div>

  </ng-container>

</div>
