<div class="stock-container">

  <!-- Chargement -->
  <div *ngIf="loading" class="loading-bar">
    <span soho-busy-indicator displayDelay="0"></span>
  </div>

  <!-- Erreur -->
  <div *ngIf="erreur" class="error-banner">
    <svg class="error-icon" viewBox="0 0 16 16" aria-hidden="true">
      <path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm.75 10.5h-1.5v-1.5h1.5v1.5zm0-3h-1.5v-4h1.5v4z"/>
    </svg>
    {{ erreur }}
  </div>

  <!-- Accueil -->
  <div *ngIf="!article && !loading && !erreur" class="welcome-state">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"/>
    </svg>
    <p>Saisissez un code article pour afficher les stocks.</p>
  </div>

  <!-- Résultats -->
  <div *ngIf="article">

    <!-- En-tête article -->
    <div class="article-header">
      <div class="article-header-main">
        <div class="article-code">
          <span class="article-code__label">Code P.F.</span>
          <strong class="article-code__value">{{ article.itno }}</strong>
        </div>
        <div class="article-divider"></div>
        <div class="article-libelle">{{ article.itds }}</div>
      </div>
      <div class="article-meta">
        <span class="article-tag" *ngIf="article.cofa">{{ article.cofa }} {{ article.alun }}</span>
        <div class="article-poids">Poids net&nbsp;: <strong>{{ article.poidsNet }} kg</strong></div>
      </div>
    </div>

    <!-- Onglets -->
    <div class="tabs-wrapper">

      <nav class="tab-nav">
        <button
          *ngFor="let tab of tabs"
          class="tab-btn"
          [class.tab-btn--active]="activeTab === tab.id"
          (click)="setTab(tab.id)">
          <ng-container [ngSwitch]="tab.id">
            <!-- Synthèse — graphique en barres -->
            <svg *ngSwitchCase="'synthese'" class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 20V10M12 20V4M6 20v-6"/>
            </svg>
            <!-- OF / POF — empilement de couches -->
            <svg *ngSwitchCase="'ofpof'" class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>
            </svg>
            <!-- Achats — panier -->
            <svg *ngSwitchCase="'achats'" class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
            </svg>
            <!-- Réservations — groupe de clients -->
            <svg *ngSwitchCase="'ventes'" class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            <!-- Aktions — fichier contrat -->
            <svg *ngSwitchCase="'actions'" class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
            </svg>
            <!-- Cumul Ventes — calendrier -->
            <svg *ngSwitchCase="'cumul'" class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
          </ng-container>
          {{ tab.label }}
          <span *ngIf="tab.badge" class="tab-count">{{ badgeFor(tab.id) }}</span>
        </button>
      </nav>

      <!-- Contenu des onglets -->
      <div class="tab-content">
        <app-tab-synthese     *ngIf="activeTab === 'synthese'" [article]="article" [whgrSortant]="whgrSortant" (tabChange)="setTab($event)" (whgrSortantChange)="rechargerSortant($event)"></app-tab-synthese>
        <app-tab-ofpof        *ngIf="activeTab === 'ofpof'"   [lignes]="movsOfPof"   [unms]="article.unms"></app-tab-ofpof>
        <app-tab-achats       *ngIf="activeTab === 'achats'"  [lignes]="movsAchats"  [unms]="article.unms"></app-tab-achats>
        <app-tab-reservations *ngIf="activeTab === 'ventes'"  [lignes]="movsVentes"  [unms]="article.unms"></app-tab-reservations>
        <app-tab-actions      *ngIf="activeTab === 'actions'" [itno]="article.itno" [unms]="article.unms" (contractsLoaded)="updateActionsBadge($event)"></app-tab-actions>
        <app-tab-cumul        *ngIf="activeTab === 'cumul'"   [itno]="article.itno" [unms]="article.unms"></app-tab-cumul>
      </div>
    </div>
  </div>

</div>
