<div class="tab-content">

  <div *ngIf="lignes.length === 0" class="empty-msg">
    Aucun ordre d'achat trouvé pour cet article.
  </div>

  <div
    *ngIf="lignes.length > 0"
    soho-datagrid
    [dataset]="lignes"
    [columns]="colonnes"
    [selectable]="false"
    [filterable]="true"
    [rowHeight]="'short'"
    [paging]="true"
    [pagesize]="10"
    [pagesizes]="[5, 10, 25, 50, 100]"
    [enableTooltips]="true"
    [initialSort]="{ sortId: 'pldt', ascending: true }"
    style="width: 100%">
  </div>

  <div *ngIf="lignes.length > 0"
       style="display:flex;gap:24px;padding:10px 16px;background:#f8fafc;border-top:1px solid #e2e8f0;font-size:14px;">
    <span>Total achats : <strong>{{ fmt(totalQty) }} <em style="font-size:12px;color:#94a3b8;font-style:normal">{{ unms }}</em></strong></span>
  </div>

</div>
