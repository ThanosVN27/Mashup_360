<p *ngIf="lignes.length === 0" class="empty-msg">Aucun ordre d'achat pour cet article.</p>

<table *ngIf="lignes.length > 0" class="ids-table">
  <thead>
    <tr>
      <th>N° commande</th>
      <th>Quantité</th>
      <th>Date livraison</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let m of lignes">
      <td>{{ m.ridn }}</td>
      <td class="num">{{ m.trqt }}</td>
      <td>{{ m.codt }}</td>
    </tr>
  </tbody>
</table>
