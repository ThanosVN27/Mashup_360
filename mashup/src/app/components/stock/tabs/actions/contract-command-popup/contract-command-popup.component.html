<div *ngIf="visible" class="popup-overlay" (click)="onClose()">
  <div class="popup-content" (click)="$event.stopPropagation()">

    <!-- ── Header ── -->
    <div class="popup-header">
      <div class="popup-header-info">
        <span class="popup-header-title">Commandes liées à l'Aktion</span>
        <div class="popup-chips">
          <span class="popup-chip">
            <span class="chip-label">N° Cde ouverte :</span>
            <span class="chip-value">{{ selectedContract?.openOrderNumber }}</span>
          </span>
          <span class="popup-chip">
            <span class="chip-label">Client :</span>
            <span class="chip-value">{{ selectedContract?.customerCode }}</span>
          </span>
          <span class="popup-chip">
            <span class="chip-label">Désignation :</span>
            <span class="chip-value">{{ selectedContract?.description }}</span>
          </span>
        </div>
      </div>
      <button class="popup-close-btn" (click)="onClose()" title="Fermer">&#10005;</button>
    </div>

    <!-- ── Body ── -->
    <div class="popup-body">

      <div *ngIf="isLoading" class="popup-loading">
        <div soho-busyindicator [active]="true" label="Chargement…"></div>
      </div>

      <div *ngIf="errorMessage" class="popup-error">{{ errorMessage }}</div>

      <div *ngIf="!isLoading && !errorMessage"
        soho-datagrid
        [dataset]="sortedOrders"
        [columns]="orderColumns"
        [emptyMessage]="emptyMsg"
        [filterable]="true"
        [paging]="true"
        [pagesize]="5"
        [pagesizes]="[5, 10, 25, 50, 100]"
        [rowHeight]="'short'">
      </div>

    </div>

    <!-- ── Footer ── -->
    <div class="popup-footer">
      <button class="popup-close-bar" (click)="onClose()">Fermer</button>
    </div>
  </div>
</div>
