<div class="tab-content">

  <!-- Filtre : cumul à partir d'une date -->
  <div class="cumul-filtre" *ngIf="allLignes.length > 0">
    <label class="cumul-filtre-label" for="cumul-date-debut">Cumul à partir de</label>
    <div class="field cumul-filtre-field">
      <input
        soho-datepicker
        id="cumul-date-debut"
        [showMonthYearPicker]="true"
        [hideDays]="true"
        dateFormat="MMMM yyyy"
        placeholder="Tous les mois"
        (change)="onDateChange()">
    </div>
    <button
      soho-button="tertiary"
      type="button"
      *ngIf="seuilMois"
      (click)="reinitialiserFiltre()">
      Réinitialiser
    </button>
  </div>

  <!-- État vide -->
  <div *ngIf="lignes.length === 0" class="empty-msg">
    {{ allLignes.length > 0 ? 'Aucune vente facturée à partir de cette date.' : 'Aucune vente facturée pour cet article.' }}
  </div>

  <ng-container *ngIf="lignes.length > 0">

    <div
      soho-datagrid="auto"
      [dataset]="lignes"
      [columns]="colonnes"
      [selectable]="false"
      [filterable]="true"
      [sizeColumnsEqually]="true"
      [rowHeight]="'short'"
      [paging]="true"
      [pagesize]="25"
      [pagesizes]="[25, 50, 100]"
      style="width: 100%">
    </div>

    <div class="cumul-totaux">
      <span>Nb de mois&nbsp;: <strong>{{ nbMois }}</strong></span>
      <span class="cumul-sep">|</span>
      <span>Qté cdée totale&nbsp;: <strong>{{ totalQteLabel }}</strong> {{ unms || 'U/M bs' }}</span>
    </div>

  </ng-container>

</div>
