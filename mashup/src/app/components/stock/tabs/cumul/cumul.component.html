<div class="tab-content">

  <!-- Filtre : cumul à partir d'une date -->
  <div class="cumul-filtre" *ngIf="nbLignesData > 0">
    <label class="cumul-filtre-label" for="cumul-date-debut">Cumul à partir de</label>
    <div class="field cumul-filtre-field">
      <input
        soho-datepicker
        id="cumul-date-debut"
        [showMonthYearPicker]="true"
        [hideDays]="true"
        dateFormat="MMMM yyyy"
        placeholder="Tous les mois"
        (change)="onDateChange()">
    </div>
    <button
      soho-button="tertiary"
      type="button"
      *ngIf="seuilMois"
      (click)="reinitialiserFiltre()">
      Réinitialiser
    </button>
  </div>

  <!-- État vide -->
  <div *ngIf="annees.length === 0" class="empty-msg">
    {{ nbLignesData > 0 ? 'Aucune vente facturée à partir de cette date.' : 'Aucune vente facturée pour cet article.' }}
  </div>

  <!-- Tableau croisé : mois en lignes, années en colonnes, + ligne Total -->
  <div class="cumul-grid-wrap" *ngIf="annees.length > 0">
    <div
      soho-datagrid="auto"
      [dataset]="pivotRows"
      [columns]="colonnes"
      [selectable]="false"
      [filterable]="false"
      [paging]="false"
      [sizeColumnsEqually]="true"
      [rowHeight]="'normal'"
      style="width: 100%">
    </div>
  </div>

</div>
