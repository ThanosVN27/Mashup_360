<div class="tab-content">
  <span *ngIf="isLoading" soho-busy-indicator displayDelay="0"></span>

  <div *ngIf="errorMessage" class="error-msg">{{ errorMessage }}</div>

  <!-- Barre de filtre OF / POF -->
  <div *ngIf="!isLoading && lignes.length > 0" class="ofpof-toolbar">
    <button class="ofpof-btn" [class.ofpof-btn--active]="filtre === 'tous'" (click)="setFiltre('tous')">
      Tous <span class="ofpof-count">{{ lignes.length }}</span>
    </button>
    <button class="ofpof-btn badge-of-btn" [class.ofpof-btn--active]="filtre === 'of'" (click)="setFiltre('of')">
      OF <span class="ofpof-count">{{ countOf }}</span>
    </button>
    <button class="ofpof-btn badge-pof-btn" [class.ofpof-btn--active]="filtre === 'pof'" (click)="setFiltre('pof')">
      POF <span class="ofpof-count">{{ countPof }}</span>
    </button>
  </div>

  <div *ngIf="!isLoading && !errorMessage && lignesFiltrees.length === 0" class="empty-msg">
    Aucun mouvement trouvé pour cet article.
  </div>

  <div
    *ngIf="!isLoading && lignesFiltrees.length > 0"
    soho-datagrid
    [dataset]="lignesFiltrees"
    [columns]="colonnes"
    [selectable]="false"
    [filterable]="true"
    [rowHeight]="'short'"
    [paging]="true"
    [pagesize]="10"
    [pagesizes]="[5, 10, 25, 100]"
    [enableTooltips]="true"
    style="width: 100%">
  </div>
</div>
