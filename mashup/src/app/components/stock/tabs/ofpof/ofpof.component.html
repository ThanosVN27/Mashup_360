<div class="tab-content">
  <!-- Indicateur de chargement -->
  <span *ngIf="isLoading" soho-busy-indicator displayDelay="0"></span>

  <!-- Message d'erreur -->
  <div *ngIf="errorMessage" class="error-msg">{{ errorMessage }}</div>

  <div *ngIf="!isLoading && toutesLignes.length > 0" class="ofpof-toolbar">
    <button class="ofpof-btn"
            [class.ofpof-btn--active]="filtre === 'tous'"
            (click)="setFiltre('tous')">
      Tous <span class="ofpof-count">{{ toutesLignes.length }}</span>
    </button>

    <button class="ofpof-btn badge-of-btn"
            [class.ofpof-btn--active]="filtre === 'of'"
            (click)="setFiltre('of')">
      OF <span class="ofpof-count">{{ countOf }}</span>
    </button>

    <button class="ofpof-btn badge-pof-btn"
            [class.ofpof-btn--active]="filtre === 'pof'"
            (click)="setFiltre('pof')">
      POF <span class="ofpof-count">{{ countPof }}</span>
    </button>
  </div>

  <div *ngIf="!isLoading && !errorMessage && lignesFiltrees.length === 0" class="empty-msg">
    Aucun mouvement trouvé pour cet article.
  </div>

  <div
    *ngIf="!isLoading && lignesFiltrees.length > 0"
    soho-datagrid
    [dataset]="lignesFiltrees"
    [columns]="colonnes"
    [selectable]="false"
    [filterable]="true"
    [rowHeight]="'short'"
    [paging]="true"
    [pagesize]="10"
    [pagesizes]="[5, 10, 25, 50, 100]"
    [enableTooltips]="true"
    [initialSort]="{ sortId: 'pldt', ascending: true }"
    style="width: 100%">
  </div>

  <div *ngIf="!isLoading && toutesLignes.length > 0"
       style="display:flex;gap:24px;padding:10px 16px;background:#f8fafc;border-top:1px solid #e2e8f0;font-size:14px;flex-wrap:wrap;">
    <span *ngIf="filtre !== 'pof'">
      Total OF : <strong>{{ fmt(totalOfQty) }} <em style="font-size:13px;color:#94a3b8;font-style:normal">{{ unms }}</em></strong>
    </span>
    <span *ngIf="filtre !== 'of'">
      Total POF : <strong>{{ fmt(totalPofQty) }} <em style="font-size:13px;color:#94a3b8;font-style:normal">{{ unms }}</em></strong>
    </span>
  </div>

</div>
